name: P0 probe

on:
  pull_request:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --check scripts/probe.mjs
      - run: node --test test/probe.test.mjs
